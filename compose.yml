# Local production-like stack.
# All secrets come from the git-ignored .env file (create it with: make secrets).
# `${VAR:?...}` makes compose refuse to start if a value is missing.
name: perseus

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-service: &service
  <<: *hardening
  restart: unless-stopped
  networks: [backend]
  deploy:
    resources:
      limits: { cpus: "0.50", memory: 384M }

x-migrate: &migrate
  <<: *hardening
  restart: "no"
  networks: [backend]
  command: ["alembic", "upgrade", "head"]
  healthcheck: { disable: true }
  depends_on:
    postgres: { condition: service_healthy }

x-env: &env
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  DB_HOST: postgres
  DB_SSLMODE: prefer  # use verify-full with a TLS-enabled managed database in production
  REDIS_URL: redis://redis:6379/0
  JWT_ISSUER: https://auth.perseus.local
  JWKS_URL: http://auth:8000/.well-known/jwks.json
  AUTH_TOKEN_URL: http://auth:8000/oauth/token
  FORWARDED_ALLOW_IPS: 172.30.0.10  # only the edge proxy may set X-Forwarded-*

x-runtime-env: &runtime-env
  <<: *env
  REDIS_PASSWORD: ${REDIS_PASSWORD:?missing in .env - run make secrets}
  EVENT_SIGNING_KEY: ${EVENT_SIGNING_KEY:?missing in .env - run make secrets}

x-runtime-deps: &runtime-deps
  redis: { condition: service_healthy }

services:
  # ------------------------------------------------------------------ edge ----
  gateway:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8443:8443"]
    networks:
      edge: {}
      backend: { ipv4_address: 172.30.0.10 }
    tmpfs: [/tmp, /var/cache/nginx]
    environment:
      TLS_CERT: ${TLS_CERT:?missing in .env - run make secrets}
      TLS_KEY: ${TLS_KEY:?missing in .env - run make secrets}
    # Write the certificate and key from env into tmpfs (never onto disk), then start nginx.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 && mkdir -p /tmp/tls
        && printf '%b\n' "$$TLS_CERT" > /tmp/tls/cert.pem
        && printf '%b\n' "$$TLS_KEY" > /tmp/tls/key.pem
        && exec nginx -g 'daemon off;'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth: { condition: service_healthy }
      accounts: { condition: service_healthy }
      ledger: { condition: service_healthy }
      fraud: { condition: service_healthy }
      notifications: { condition: service_healthy }
      audit: { condition: service_healthy }

  # --------------------------------------------------------------- services ----
  auth-migrate:
    <<: *migrate
    image: perseus/auth:local
    build: { context: ., args: { SERVICE: auth } }
    environment:
      <<: *env
      DB_NAME: auth
      DB_USER: auth_migrator
      DB_PASSWORD: ${AUTH_DB_MIGRATOR_PASSWORD:?missing in .env - run make secrets}
  auth:
    <<: *service
    image: perseus/auth:local
    build: { context: ., args: { SERVICE: auth } }
    environment:
      <<: *runtime-env
      DB_NAME: auth
      DB_USER: auth_app
      DB_PASSWORD: ${AUTH_DB_APP_PASSWORD:?missing in .env - run make secrets}
      ALLOWED_HOSTS: '["auth","localhost","127.0.0.1","api.perseus.local"]'
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?missing in .env - run make secrets}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?missing in .env - run make secrets}
      SERVICE_CLIENTS: ${SERVICE_CLIENTS:?missing in .env - run make secrets}
    depends_on:
      <<: *runtime-deps
      auth-migrate: { condition: service_completed_successfully }

  accounts-migrate:
    <<: *migrate
    image: perseus/accounts:local
    build: { context: ., args: { SERVICE: accounts } }
    environment:
      <<: *env
      DB_NAME: accounts
      DB_USER: accounts_migrator
      DB_PASSWORD: ${ACCOUNTS_DB_MIGRATOR_PASSWORD:?missing in .env - run make secrets}
  accounts:
    <<: *service
    image: perseus/accounts:local
    build: { context: ., args: { SERVICE: accounts } }
    environment:
      <<: *runtime-env
      DB_NAME: accounts
      DB_USER: accounts_app
      DB_PASSWORD: ${ACCOUNTS_DB_APP_PASSWORD:?missing in .env - run make secrets}
      ALLOWED_HOSTS: '["accounts","localhost","127.0.0.1","api.perseus.local"]'
      SERVICE_CLIENT_ID: accounts-service
      SERVICE_CLIENT_SECRET: ${ACCOUNTS_CLIENT_SECRET:?missing in .env - run make secrets}
      LEDGER_BASE_URL: http://ledger:8000
    depends_on:
      <<: *runtime-deps
      accounts-migrate: { condition: service_completed_successfully }
      auth: { condition: service_healthy }

  ledger-migrate:
    <<: *migrate
    image: perseus/ledger:local
    build: { context: ., args: { SERVICE: ledger } }
    environment:
      <<: *env
      DB_NAME: ledger
      DB_USER: ledger_migrator
      DB_PASSWORD: ${LEDGER_DB_MIGRATOR_PASSWORD:?missing in .env - run make secrets}
  ledger:
    <<: *service
    image: perseus/ledger:local
    build: { context: ., args: { SERVICE: ledger } }
    environment:
      <<: *runtime-env
      DB_NAME: ledger
      DB_USER: ledger_app
      DB_PASSWORD: ${LEDGER_DB_APP_PASSWORD:?missing in .env - run make secrets}
      ALLOWED_HOSTS: '["ledger","localhost","127.0.0.1","api.perseus.local"]'
      SERVICE_CLIENT_ID: ledger-service
      SERVICE_CLIENT_SECRET: ${LEDGER_CLIENT_SECRET:?missing in .env - run make secrets}
      ACCOUNTS_BASE_URL: http://accounts:8000
      FRAUD_BASE_URL: http://fraud:8000
    depends_on:
      <<: *runtime-deps
      ledger-migrate: { condition: service_completed_successfully }
      auth: { condition: service_healthy }

  fraud-migrate:
    <<: *migrate
    image: perseus/fraud:local
    build: { context: ., args: { SERVICE: fraud } }
    environment:
      <<: *env
      DB_NAME: fraud
      DB_USER: fraud_migrator
      DB_PASSWORD: ${FRAUD_DB_MIGRATOR_PASSWORD:?missing in .env - run make secrets}
  fraud:
    <<: *service
    image: perseus/fraud:local
    build: { context: ., args: { SERVICE: fraud } }
    environment:
      <<: *runtime-env
      DB_NAME: fraud
      DB_USER: fraud_app
      DB_PASSWORD: ${FRAUD_DB_APP_PASSWORD:?missing in .env - run make secrets}
      ALLOWED_HOSTS: '["fraud","localhost","127.0.0.1","api.perseus.local"]'
    depends_on:
      <<: *runtime-deps
      fraud-migrate: { condition: service_completed_successfully }
      auth: { condition: service_healthy }

  notifications-migrate:
    <<: *migrate
    image: perseus/notifications:local
    build: { context: ., args: { SERVICE: notifications } }
    environment:
      <<: *env
      DB_NAME: notifications
      DB_USER: notifications_migrator
      DB_PASSWORD: ${NOTIFICATIONS_DB_MIGRATOR_PASSWORD:?missing in .env - run make secrets}
  notifications:
    <<: *service
    image: perseus/notifications:local
    build: { context: ., args: { SERVICE: notifications } }
    environment:
      <<: *runtime-env
      DB_NAME: notifications
      DB_USER: notifications_app
      DB_PASSWORD: ${NOTIFICATIONS_DB_APP_PASSWORD:?missing in .env - run make secrets}
      ALLOWED_HOSTS: '["notifications","localhost","127.0.0.1","api.perseus.local"]'
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "true"
      SMTP_CA_PEM: ${TLS_CA_CERT:?missing in .env - run make secrets}
    depends_on:
      <<: *runtime-deps
      notifications-migrate: { condition: service_completed_successfully }
      auth: { condition: service_healthy }

  audit-migrate:
    <<: *migrate
    image: perseus/audit:local
    build: { context: ., args: { SERVICE: audit } }
    environment:
      <<: *env
      DB_NAME: audit
      DB_USER: audit_migrator
      DB_PASSWORD: ${AUDIT_DB_MIGRATOR_PASSWORD:?missing in .env - run make secrets}
  audit:
    <<: *service
    image: perseus/audit:local
    build: { context: ., args: { SERVICE: audit } }
    environment:
      <<: *runtime-env
      DB_NAME: audit
      DB_USER: audit_app
      DB_PASSWORD: ${AUDIT_DB_APP_PASSWORD:?missing in .env - run make secrets}
      ALLOWED_HOSTS: '["audit","localhost","127.0.0.1","api.perseus.local"]'
    depends_on:
      <<: *runtime-deps
      audit-migrate: { condition: service_completed_successfully }
      auth: { condition: service_healthy }

  # ---------------------------------------------------------- infrastructure ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env - run make secrets}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Consumed once by infra/postgres/init to create per-service roles.
      AUTH_DB_MIGRATOR_PASSWORD: ${AUTH_DB_MIGRATOR_PASSWORD:?missing in .env}
      AUTH_DB_APP_PASSWORD: ${AUTH_DB_APP_PASSWORD:?missing in .env}
      ACCOUNTS_DB_MIGRATOR_PASSWORD: ${ACCOUNTS_DB_MIGRATOR_PASSWORD:?missing in .env}
      ACCOUNTS_DB_APP_PASSWORD: ${ACCOUNTS_DB_APP_PASSWORD:?missing in .env}
      LEDGER_DB_MIGRATOR_PASSWORD: ${LEDGER_DB_MIGRATOR_PASSWORD:?missing in .env}
      LEDGER_DB_APP_PASSWORD: ${LEDGER_DB_APP_PASSWORD:?missing in .env}
      FRAUD_DB_MIGRATOR_PASSWORD: ${FRAUD_DB_MIGRATOR_PASSWORD:?missing in .env}
      FRAUD_DB_APP_PASSWORD: ${FRAUD_DB_APP_PASSWORD:?missing in .env}
      NOTIFICATIONS_DB_MIGRATOR_PASSWORD: ${NOTIFICATIONS_DB_MIGRATOR_PASSWORD:?missing in .env}
      NOTIFICATIONS_DB_APP_PASSWORD: ${NOTIFICATIONS_DB_APP_PASSWORD:?missing in .env}
      AUDIT_DB_MIGRATOR_PASSWORD: ${AUDIT_DB_MIGRATOR_PASSWORD:?missing in .env}
      AUDIT_DB_APP_PASSWORD: ${AUDIT_DB_APP_PASSWORD:?missing in .env}
    command: ["postgres", "-c", "password_encryption=scram-sha-256",
              "-c", "log_connections=on", "-c", "log_disconnections=on",
              "-c", "max_connections=400"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?missing in .env - run make secrets}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?missing in .env - run make secrets}
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD"
        --appendonly yes --protected-mode yes
        --rename-command FLUSHALL "" --rename-command FLUSHDB ""
        --rename-command DEBUG "" --rename-command CONFIG ""
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:  # local SMTP sink with STARTTLS; UI at http://127.0.0.1:8025
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    networks: [backend, edge]
    ports: ["127.0.0.1:8025:8025"]
    tmpfs: [/tmp]
    environment:
      TLS_CERT: ${TLS_CERT:?missing in .env - run make secrets}
      TLS_KEY: ${TLS_KEY:?missing in .env - run make secrets}
      MP_SMTP_TLS_CERT: /tmp/tls/cert.pem
      MP_SMTP_TLS_KEY: /tmp/tls/key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 && mkdir -p /tmp/tls
        && printf '%b\n' "$$TLS_CERT" > /tmp/tls/cert.pem
        && printf '%b\n' "$$TLS_KEY" > /tmp/tls/key.pem
        && exec /mailpit

networks:
  edge: {}
  backend:
    internal: true  # no route to the internet from services or data stores
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]

volumes:
  pgdata: {}
  redisdata: {}
