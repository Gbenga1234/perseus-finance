[project]
name = "accounts-service"
version = "0.1.0"
description = "Customer account lifecycle (open, freeze, close) for Perseus."
requires-python = ">=3.12"
dependencies = ["perseus-common"]

[tool.uv.sources]
perseus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accounts_service"]
