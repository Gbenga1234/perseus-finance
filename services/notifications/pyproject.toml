[project]
name = "notifications-service"
version = "0.1.0"
description = "Event-driven customer notifications (email) for Perseus."
requires-python = ">=3.12"
dependencies = ["perseus-common", "aiosmtplib>=3.0", "jinja2>=3.1.4"]

[tool.uv.sources]
perseus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifications_service"]
