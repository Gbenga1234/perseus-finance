[project]
name = "ledger-service"
version = "0.1.0"
description = "Double-entry ledger: balances, transfers and deposits for Perseus."
requires-python = ">=3.12"
dependencies = ["perseus-common"]

[tool.uv.sources]
perseus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_service"]
