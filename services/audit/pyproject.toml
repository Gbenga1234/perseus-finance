[project]
name = "audit-service"
version = "0.1.0"
description = "Tamper-evident, append-only audit trail of all Perseus domain events."
requires-python = ">=3.12"
dependencies = ["perseus-common"]

[tool.uv.sources]
perseus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_service"]
