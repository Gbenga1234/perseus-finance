[project]
name = "auth-service"
version = "0.1.0"
description = "Identity, authentication (passwords + TOTP MFA) and token issuance for Perseus."
requires-python = ">=3.12"
dependencies = [
    "perseus-common",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
perseus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]
