[project]
name = "fraud-service"
version = "0.1.0"
description = "Real-time transaction risk scoring for Perseus."
requires-python = ">=3.12"
dependencies = ["perseus-common"]

[tool.uv.sources]
perseus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_service"]
