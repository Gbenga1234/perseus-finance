name: Production Docker Deployment - Audit

on:
  push:
    branches: [main]
    # Only rebuild when this service or the code it is built from changes.
    paths:
      - "services/audit/**"
      - "libs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-audit
  cancel-in-progress: false

env:
  IMAGE_NAME: gowobo/perseus-audit

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up Docker Buildx for multi-platform builds (optional)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 3: Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 4: Generate release image tag
    - name: Generate image tag
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        DATE=$(date +'%Y%m%d')
        echo "IMAGE_TAG=prod-${DATE}-${SHORT_SHA}" >> $GITHUB_ENV

    # Step 5: Build audit image (build context is the repo root: shared lib + uv.lock)
    - name: Build Docker image - Audit
      run: |
        docker build \
          -f services/audit/Dockerfile \
          -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          .

    # Step 6: Push image
    - name: Push image to DockerHub
      run: |
        docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
