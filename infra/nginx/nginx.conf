# Edge proxy: TLS termination, rate limiting, request size limits and routing.
# Only public /v1 routes are exposed; /internal, /metrics, /health and /oauth are not.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/json;
    charset utf-8;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # $uri (not $request_uri) so query strings never reach the logs.
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;

    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=credentials:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=money:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream auth_upstream          { server auth:8000;          keepalive 16; }
    upstream accounts_upstream      { server accounts:8000;      keepalive 16; }
    upstream ledger_upstream        { server ledger:8000;        keepalive 16; }
    upstream fraud_upstream         { server fraud:8000;         keepalive 16; }
    upstream notifications_upstream { server notifications:8000; keepalive 16; }
    upstream audit_upstream         { server audit:8000;         keepalive 16; }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        # Written from TLS_CERT / TLS_KEY env vars into tmpfs at container start.
        ssl_certificate     /tmp/tls/cert.pem;
        ssl_certificate_key /tmp/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        limit_conn perip 20;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append) client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        location = /.well-known/jwks.json {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://auth_upstream;
        }
        location ~ ^/v1/auth/(login|register|refresh|password)$ {
            limit_req zone=credentials burst=5 nodelay;
            proxy_pass http://auth_upstream;
        }
        location /v1/auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth_upstream;
        }
        location /v1/accounts {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://accounts_upstream;
        }
        location ~ ^/v1/ledger/(transfers|deposits)$ {
            limit_req zone=money burst=5 nodelay;
            proxy_pass http://ledger_upstream;
        }
        location /v1/ledger/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ledger_upstream;
        }
        location /v1/fraud/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://fraud_upstream;
        }
        location /v1/notifications {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://notifications_upstream;
        }
        location /v1/audit/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://audit_upstream;
        }
        location / {
            return 404 '{"type":"about:blank","title":"Not Found","status":404,"code":"not_found"}';
        }
    }
}
