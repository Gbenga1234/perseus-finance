# Edge proxy: TLS termination, rate limiting, request size limits and routing.
# Only public /v1 routes are exposed; /internal, /metrics, /health and /oauth are not.
# The master process starts as root only to bind ports and read the Let's Encrypt keys
# (certbot makes them root-only); workers that handle traffic run as "nginx".
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/json;
    charset utf-8;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # $uri (not $request_uri) so query strings never reach the logs.
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;

    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=credentials:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=money:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream auth_upstream          { server auth:8000;          keepalive 16; }
    upstream accounts_upstream      { server accounts:8000;      keepalive 16; }
    upstream ledger_upstream        { server ledger:8000;        keepalive 16; }
    upstream fraud_upstream         { server fraud:8000;         keepalive 16; }
    upstream notifications_upstream { server notifications:8000; keepalive 16; }
    upstream audit_upstream         { server audit:8000;         keepalive 16; }

    # Server blocks: rendered from templates/*.template with ${DOMAIN} substituted.
    include /etc/nginx/conf.d/*.conf;
}
